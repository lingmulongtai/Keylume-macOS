name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check tag before signing
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
  macos:
    needs: verify-tag
    uses: ./.github/workflows/macos.yml
    with:
      distribution: true
    secrets:
      MACOS_CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATES_P12_BASE64 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
  publish:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keylume-macos
          path: release-assets
      - name: Publish verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="release-assets/Keylume_${GITHUB_REF_NAME#v}_universal"
          test -s "$base.dmg"
          test -s "$base.pkg"
          gh release create "$GITHUB_REF_NAME" "$base.dmg" "$base.pkg" --verify-tag \
            --title "Keylume macOS $GITHUB_REF_NAME Preview" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --prerelease
