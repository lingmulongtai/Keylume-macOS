name: macOS build and verification
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install universal build targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npx playwright test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - run: npm run package -- --target universal-apple-darwin
      - name: Verify universal app and native self-test
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Keylume.app
          for architecture in arm64 x86_64; do
            lipo -verify_arch "$architecture" "$app/Contents/MacOS/keylume"
          done
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/keylume" --self-test "$RUNNER_TEMP/keylume-report.json"
          node -e "if (!require(process.argv[1]).passed) process.exit(1)" "$RUNNER_TEMP/keylume-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keylume-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/Keylume_*_universal.dmg
          if-no-files-found: error
          retention-days: 14
